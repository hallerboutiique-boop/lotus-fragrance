app = "lotus-fragrance-checkout"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.checkout"

[env]
  PORT = "8080"
  SITE_ORIGIN = "https://lotusfragrance.shop"
  CHECKOUT_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
