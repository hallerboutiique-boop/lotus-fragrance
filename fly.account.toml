app = "lotus-fragrance-accounts"
primary_region = "fra"
[build]
  dockerfile = "Dockerfile.account"
[env]
  PUBLIC_ORIGIN = "https://lotus-fragrance-accounts.fly.dev"
  DATABASE_PATH = "/data/accounts.sqlite"
[[mounts]]
  source = "accounts_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
